[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "massengine"
version = "1.1.0"
description = "Official Python SDK for the MassEngine vector and hybrid search database."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
  { name = "MassEngine", email = "dev@massengine.com" }
]
keywords = ["vector-database", "hybrid-search", "rag", "embeddings", "bm25", "massengine"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
dependencies = []

[project.urls]
Homepage = "https://massengine.com"
Repository = "https://github.com/massengine-dev/massengine-python"
