[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "massengine"
version = "1.1.3"
description = "Official Python SDK for the MassEngine vector and hybrid search database."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
  { name = "MassEngine", email = "dev@massengine.com" }
]
keywords = ["vector-database", "hybrid-search", "rag", "embeddings", "bm25", "massengine"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://massengine.com"
Documentation = "https://massengine.com/docs"
Repository = "https://github.com/massengine-dev/massengine-python"

[tool.hatch.build.targets.wheel]
packages = ["massengine"]

[tool.hatch.build.targets.sdist]
include = [
  "/massengine",
  "/tests",
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
]
